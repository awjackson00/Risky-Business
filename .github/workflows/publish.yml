name: Publish Risky Business

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_source:
        description: "Refresh website copy from analysis repository"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: risky-business-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out hosted copy
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out original analysis and website assets
        uses: actions/checkout@v4
        with:
          repository: awjackson00/data510--Quant-Back-Testing-
          ref: main
          path: .source-analysis
          persist-credentials: false

      - name: Seed or explicitly refresh the full website copy
        env:
          REFRESH_SOURCE: ${{ inputs.refresh_source || 'false' }}
        run: |
          set -euo pipefail
          if [[ ! -f docs/index.html || "$REFRESH_SOURCE" == "true" ]]; then
            mkdir -p docs
            rsync -a --delete .source-analysis/docs/ docs/
            touch docs/.nojekyll
            echo "Copied original HTML, stylesheet, figures, poster and both-author license."
          else
            echo "Using locally maintained copy; source refresh was not requested."
          fi

      - name: Verify all pages and local figures
        run: python3 scripts/verify_site.py

      - name: Save the complete copy in this repository
        run: |
          set -euo pipefail
          git add -- docs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import complete Risky Business capstone website"
            git push origin HEAD:main
          else
            echo "Site copy is already up to date."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
