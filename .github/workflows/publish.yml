name: Publish Risky Business

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_source:
        description: "Refresh website copy from analysis repository"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: risky-business-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out hosted copy
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out original analysis and website assets
        uses: actions/checkout@v4
        with:
          repository: awjackson00/data510--Quant-Back-Testing-
          ref: main
          path: .source-analysis
          persist-credentials: false

      - name: Seed or explicitly refresh the full website copy
        env:
          REFRESH_SOURCE: ${{ inputs.refresh_source || 'false' }}
        run: |
          set -euo pipefail
          if [[ ! -f docs/index.html || "$REFRESH_SOURCE" == "true" ]]; then
            mkdir -p docs
            rsync -a --delete .source-analysis/docs/ docs/
            touch docs/.nojekyll
            echo "Copied original HTML, stylesheet, figures, poster and both-author license."
          else
            echo "Using locally maintained copy; source refresh was not requested."
          fi

      - name: Verify all pages and local figures
        run: python3 scripts/verify_site.py

      - name: Mirror real website into repository root for branch Pages
        run: |
          set -euo pipefail
          # GitHub Pages may be configured for main / (root), not just Actions.
          # In either case visitors must see the real study rather than README.md.
          cp docs/index.html docs/results.html docs/writeup.html docs/reproducibility.html ./
          mkdir -p assets
          rsync -a --delete docs/assets/ assets/
          cp docs/LICENSE ./LICENSE
          touch .nojekyll

      - name: Verify root-hosted pages and assets
        run: |
          set -euo pipefail
          for page in index.html results.html writeup.html reproducibility.html; do
            test -s "$page"
            cmp "docs/$page" "$page"
          done
          test -s assets/css/style.css
          for name in figure1 figure2 figure3; do test -s "assets/figures/$name.png"; done
          test -s assets/poster.pdf
          cmp docs/LICENSE LICENSE

      - name: Save the complete copy in this repository
        run: |
          set -euo pipefail
          git add -- docs index.html results.html writeup.html reproducibility.html assets LICENSE .nojekyll
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import complete Risky Business capstone website"
            git push origin HEAD:main
          else
            echo "Site copy is already up to date."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
